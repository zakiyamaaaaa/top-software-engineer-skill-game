<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">分散システム：一部の障害に耐える</title>
  <desc id="desc">一部の障害、やり直し、同じ操作を繰り返しても一度だけ効く設計、値が揃うまでの時間、順番待ち・一時保存・複製の関係を示す図。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a8e6c8"/></marker><style>.t{font-family:system-ui,sans-serif;fill:#eff9f4}.s{font-family:system-ui,sans-serif;fill:#bad8cf;font-size:15px}.b{stroke:#65978a;stroke-width:2}.h{font-size:18px;font-weight:700}</style></defs>
  <rect width="900" height="520" rx="24" fill="#172f38"/><text x="42" y="46" class="t" font-size="28" font-weight="700">分散システム：一部の障害に耐える</text><text x="42" y="75" class="s">返事がない、二重に届く、古い値が見える前提で設計する</text>
  <rect x="42" y="106" width="252" height="175" rx="16" fill="#29474f" class="b"/><text x="62" y="138" class="t h">一部だけ失敗する</text><circle cx="105" cy="195" r="25" fill="#59818a"/><circle cx="185" cy="170" r="25" fill="#59818a"/><circle cx="225" cy="231" r="25" fill="#c97f87"/><path d="M127 187L162 176M199 189L217 214M127 211L201 230" stroke="#a8e6c8" stroke-width="3" marker-end="url(#a)"/><text x="62" y="260" class="s">一つの失敗だけで全体を止めない</text>
  <rect x="322" y="106" width="252" height="175" rx="16" fill="#34485e" class="b"/><text x="342" y="138" class="t h">繰り返しても一度だけ</text><path d="M351 190H503" stroke="#a8e6c8" stroke-width="3" marker-end="url(#a)"/><path d="M503 215H351" stroke="#e8b476" stroke-width="3" marker-end="url(#a)"/><rect x="391" y="170" width="91" height="66" rx="10" fill="#577e83"/><text x="408" y="197" class="t">操作番号</text><text x="403" y="219" class="s" font-size="12">一度だけ実行</text><text x="342" y="260" class="s">間隔を広げる + 回数制限</text>
  <rect x="602" y="106" width="256" height="175" rx="16" fill="#4a3a57" class="b"/><text x="622" y="138" class="t h">いつ同じ値にするか</text><text x="622" y="172" class="s">すぐ全員が同じ値</text><path d="M622 188H812" stroke="#7fc4ff" stroke-width="4" marker-end="url(#a)"/><text x="622" y="220" class="s">しばらく後に同じ値</text><path d="M622 236C678 205 743 267 812 236" fill="none" stroke="#e8b476" stroke-width="3"/><text x="622" y="264" class="s">速さや稼働との引き換え</text>
  <rect x="42" y="323" width="390" height="149" rx="16" fill="#304c47" class="b"/><text x="62" y="355" class="t h">順番待ちと一時保存</text><rect x="67" y="389" width="90" height="39" rx="9" fill="#4f7c70"/><text x="90" y="414" class="t">書き込み</text><path d="M157 408H219" stroke="#a8e6c8" stroke-width="3" marker-end="url(#a)"/><rect x="219" y="389" width="91" height="39" rx="9" fill="#597c72"/><text x="232" y="414" class="t">順番待ち</text><path d="M310 408H386" stroke="#a8e6c8" stroke-width="3" marker-end="url(#a)"/><text x="62" y="457" class="s">受け付けと処理を分けてやり直す</text>
  <rect x="474" y="323" width="384" height="149" rx="16" fill="#473d43" class="b"/><text x="494" y="355" class="t h">コピーと再利用</text><circle cx="540" cy="411" r="24" fill="#557b8a"/><circle cx="655" cy="389" r="24" fill="#557b8a"/><circle cx="755" cy="435" r="24" fill="#557b8a"/><path d="M562 400L633 392M677 401L733 426M561 423L733 437" stroke="#a8e6c8" stroke-width="3" marker-end="url(#a)"/><text x="494" y="463" class="s">読む負荷とデータの古さを管理する</text>
</svg>
