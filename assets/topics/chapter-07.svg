<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">データベース：整合性と検索速度を守る</title>
  <desc id="desc">識別子と入力ルール、データの重複を減らす分け方、検索用の索引、まとめて更新する処理、安全な構造変更を示す図。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a8e6c8"/></marker><style>.t{font-family:system-ui,sans-serif;fill:#eff9f4}.s{font-family:system-ui,sans-serif;fill:#bad8cf;font-size:15px}.b{stroke:#65988a;stroke-width:2}.h{font-size:18px;font-weight:700}</style></defs>
  <rect width="900" height="520" rx="24" fill="#172f38"/><text x="42" y="46" class="t" font-size="28" font-weight="700">データベース：整合性と検索速度を守る</text><text x="42" y="75" class="s">行の意味、探し方、更新手順を同じ設計図で確認する</text>
  <rect x="42" y="106" width="252" height="175" rx="16" fill="#294750" class="b"/><text x="62" y="138" class="t h">識別子とルール</text><rect x="65" y="163" width="204" height="41" rx="8" fill="#3e6a70"/><text x="80" y="189" class="s" font-size="12">顧客ID（重複なし）・メール</text><rect x="65" y="214" width="204" height="41" rx="8" fill="#42676a"/><text x="87" y="240" class="s">注文：顧客IDでつなぐ</text>
  <rect x="322" y="106" width="252" height="175" rx="16" fill="#34485e" class="b"/><text x="342" y="138" class="t h">検索用の索引</text><circle cx="447" cy="174" r="17" fill="#e8b576"/><circle cx="391" cy="227" r="17" fill="#7192a3"/><circle cx="503" cy="227" r="17" fill="#7192a3"/><path d="M435 188L400 214M459 188L494 214" stroke="#a8e6c8" stroke-width="3" marker-end="url(#a)"/><text x="342" y="260" class="s">索引から行をすばやく探す</text>
  <rect x="602" y="106" width="256" height="175" rx="16" fill="#4a3a58" class="b"/><text x="622" y="138" class="t h">データを分けて持つ</text><text x="622" y="172" class="s">同じ事実は一か所に置く</text><path d="M622 191H810" stroke="#a8e6c8" stroke-width="3" marker-end="url(#a)"/><text x="622" y="221" class="s">必要な集計だけ別に持つ</text><text x="622" y="254" class="s">更新方法を決めて矛盾を防ぐ</text>
  <rect x="42" y="323" width="390" height="149" rx="16" fill="#304b46" class="b"/><text x="62" y="355" class="t h">まとめて更新する</text><rect x="66" y="389" width="90" height="39" rx="9" fill="#4e7c70"/><text x="88" y="414" class="t">変更A</text><path d="M156 408H216" stroke="#a8e6c8" stroke-width="3" marker-end="url(#a)"/><rect x="216" y="389" width="90" height="39" rx="9" fill="#4e7c70"/><text x="238" y="414" class="t">変更B</text><path d="M306 408H371" stroke="#a8e6c8" stroke-width="3" marker-end="url(#a)"/><text x="62" y="457" class="s">成功なら確定 / 失敗なら元に戻す</text>
  <rect x="474" y="323" width="384" height="149" rx="16" fill="#473d43" class="b"/><text x="494" y="355" class="t h">構造を安全に変える</text><rect x="500" y="390" width="94" height="38" rx="9" fill="#5b7175"/><text x="514" y="414" class="t">追加</text><path d="M594 409H655" stroke="#a8e6c8" stroke-width="3" marker-end="url(#a)"/><rect x="655" y="390" width="94" height="38" rx="9" fill="#597e72"/><text x="672" y="414" class="t">データ移動</text><path d="M749 409H815" stroke="#a8e6c8" stroke-width="3" marker-end="url(#a)"/><text x="494" y="457" class="s">両方を使える間に古い形を外す</text>
</svg>
