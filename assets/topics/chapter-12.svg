<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">判断力とモバイル：目的と制約から選ぶ</title>
  <desc id="desc">必要なことと成功条件、設計上の選択、コードの見直し、通信できない時の同期、誰でも使える画面の関係を示す図。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a8e7c8"/></marker><style>.t{font-family:system-ui,sans-serif;fill:#eff9f4}.s{font-family:system-ui,sans-serif;fill:#bad8cf;font-size:15px}.b{stroke:#65978a;stroke-width:2}.h{font-size:18px;font-weight:700}</style></defs>
  <rect width="900" height="520" rx="24" fill="#172f38"/><text x="42" y="46" class="t" font-size="28" font-weight="700">判断力とモバイル：目的と制約から選ぶ</text><text x="42" y="75" class="s">要求、設計、運用、使いやすさを一つの判断の流れにつなぐ</text>
  <rect x="42" y="106" width="252" height="176" rx="16" fill="#294750" class="b"/><text x="62" y="138" class="t h">必要なこと → 成功条件</text><text x="62" y="171" class="s">誰が・何を・どんな条件で</text><path d="M62 196H254" stroke="#a8e7c8" stroke-width="3" marker-end="url(#a)"/><rect x="66" y="216" width="184" height="39" rx="9" fill="#527b72"/><text x="78" y="241" class="t" font-size="13">時間 / 失敗率 / 使いやすさ</text>
  <rect x="322" y="106" width="252" height="176" rx="16" fill="#34485e" class="b"/><text x="342" y="138" class="t h">両立できない選択</text><path d="M363 238L447 168L533 238Z" fill="#5d7285" stroke="#a8e7c8" stroke-width="2"/><text x="380" y="229" class="s">速さ</text><text x="438" y="183" class="s">運用</text><text x="493" y="229" class="s">変更</text><text x="342" y="266" class="s">条件と選んだ理由を記録する</text>
  <rect x="602" y="106" width="256" height="176" rx="16" fill="#4a3a57" class="b"/><text x="622" y="138" class="t h">コードを見直す</text><rect x="627" y="165" width="84" height="43" rx="9" fill="#6d5878"/><text x="648" y="192" class="t">変更点</text><path d="M711 186H758" stroke="#a8e7c8" stroke-width="3" marker-end="url(#a)"/><rect x="758" y="165" width="76" height="43" rx="9" fill="#527b72"/><text x="776" y="192" class="t">理由</text><text x="622" y="250" class="s">目的・危険・優先度を共有</text>
  <rect x="42" y="323" width="390" height="149" rx="16" fill="#304b47" class="b"/><text x="62" y="355" class="t h">通信なしで後から同期</text><rect x="66" y="389" width="96" height="39" rx="9" fill="#5f7581"/><text x="78" y="414" class="t" font-size="13">端末での変更</text><path d="M162 408H222" stroke="#a8e7c8" stroke-width="3" marker-end="url(#a)"/><rect x="222" y="389" width="96" height="39" rx="9" fill="#587b73"/><text x="238" y="414" class="t" font-size="13">版・操作番号</text><path d="M318 408H384" stroke="#a8e7c8" stroke-width="3" marker-end="url(#a)"/><text x="62" y="457" class="s">食い違いを解決 → 再送 → 反映</text>
  <rect x="474" y="323" width="384" height="149" rx="16" fill="#473d43" class="b"/><text x="494" y="355" class="t h">誰でも使える画面</text><rect x="500" y="389" width="76" height="39" rx="9" fill="#657583"/><text x="517" y="414" class="t">画面</text><path d="M576 408H626" stroke="#a8e7c8" stroke-width="3" marker-end="url(#a)"/><rect x="626" y="389" width="76" height="39" rx="9" fill="#597c74"/><text x="642" y="414" class="t">選択位置</text><path d="M702 408H752" stroke="#a8e7c8" stroke-width="3" marker-end="url(#a)"/><rect x="752" y="389" width="79" height="39" rx="9" fill="#5c7180"/><text x="769" y="414" class="t">読み上げ</text><text x="494" y="457" class="s">色以外でも違いが伝わるようにする</text>
</svg>
