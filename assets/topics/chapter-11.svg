<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">性能と運用：測って安全に戻せるようにする</title>
  <desc id="desc">処理のどこに時間がかかるか、遅さの分布、三つの観測手段、段階的な配信、バックアップと復旧を示す図。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a8e7c8"/></marker><style>.t{font-family:system-ui,sans-serif;fill:#eff9f4}.s{font-family:system-ui,sans-serif;fill:#bad8cf;font-size:15px}.b{stroke:#65978a;stroke-width:2}.h{font-size:18px;font-weight:700}</style></defs>
  <rect width="900" height="520" rx="24" fill="#172f38"/><text x="42" y="46" class="t" font-size="28" font-weight="700">性能と運用：測って安全に戻せるようにする</text><text x="42" y="75" class="s">遅さの原因と異常の兆候を見つけ、判断できる状態を保つ</text>
  <rect x="42" y="106" width="252" height="176" rx="16" fill="#294750" class="b"/><text x="62" y="138" class="t h">処理時間を調べる</text><path d="M67 250V169M67 250H264" stroke="#a8e7c8" stroke-width="2"/><path d="M75 239L126 231L154 179L183 225L215 215L251 218" fill="none" stroke="#e8b476" stroke-width="4"/><text x="62" y="270" class="s">よく使う処理を測ってから直す</text>
  <rect x="322" y="106" width="252" height="176" rx="16" fill="#34485e" class="b"/><text x="342" y="138" class="t h">遅さの分布</text><path d="M345 248V170M345 248H550" stroke="#a8e7c8" stroke-width="2"/><path d="M353 237L406 232L457 222L500 197L545 178" fill="none" stroke="#dc8e91" stroke-width="4"/><text x="348" y="269" class="s">平均だけで遅さを隠さない</text><text x="438" y="184" class="s" font-size="12">p99（上位1%）</text>
  <rect x="602" y="106" width="256" height="176" rx="16" fill="#4a3a57" class="b"/><text x="622" y="138" class="t h">3種類の記録</text><circle cx="684" cy="194" r="28" fill="#567b82"/><circle cx="780" cy="171" r="28" fill="#567b82"/><circle cx="780" cy="235" r="28" fill="#567b82"/><path d="M706 186L754 174M706 206L754 226M780 199V207" stroke="#a8e7c8" stroke-width="3" marker-end="url(#a)"/><text x="657" y="200" class="t">数値</text><text x="752" y="177" class="t">記録</text><text x="746" y="241" class="t">処理の流れ</text>
  <rect x="42" y="323" width="390" height="149" rx="16" fill="#304b47" class="b"/><text x="62" y="355" class="t h">自動検証と安全な配信</text><rect x="66" y="389" width="88" height="39" rx="9" fill="#54766f"/><text x="84" y="414" class="t">検証</text><path d="M154 408H214" stroke="#a8e7c8" stroke-width="3" marker-end="url(#a)"/><rect x="214" y="389" width="88" height="39" rx="9" fill="#5c7e74"/><text x="232" y="414" class="t">段階配信</text><path d="M302 408H366" stroke="#a8e7c8" stroke-width="3" marker-end="url(#a)"/><text x="62" y="457" class="s">異常なら止めて安全な版に戻す</text>
  <rect x="474" y="323" width="384" height="149" rx="16" fill="#473d43" class="b"/><text x="494" y="355" class="t h">予備保存と復旧</text><rect x="501" y="389" width="104" height="39" rx="9" fill="#647582"/><text x="514" y="414" class="t" font-size="13">予備を保存</text><path d="M605 408H670" stroke="#a8e7c8" stroke-width="3" marker-end="url(#a)"/><rect x="670" y="389" width="109" height="39" rx="9" fill="#567a70"/><text x="690" y="414" class="t">戻す練習</text><text x="494" y="457" class="s">失ってよい量・戻す時間を測る</text>
</svg>
