<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">テストとデバッグ：仮説を試して原因を探す</title>
  <desc id="desc">小さなテストから全体テスト、境目の値、状態変化、外部処理の代役、再現実験、内部構造の整理を示す図。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a9e7c9"/></marker><style>.t{font-family:system-ui,sans-serif;fill:#eff9f4}.s{font-family:system-ui,sans-serif;fill:#bad8cf;font-size:15px}.b{stroke:#65978b;stroke-width:2}.h{font-size:18px;font-weight:700}</style></defs>
  <rect width="900" height="520" rx="24" fill="#172f38"/><text x="42" y="46" class="t" font-size="28" font-weight="700">テストとデバッグ：仮説を試して原因を探す</text><text x="42" y="75" class="s">期待する動きと境目を決め、状態と原因を順に確かめる</text>
  <rect x="42" y="106" width="252" height="176" rx="16" fill="#29474f" class="b"/><text x="62" y="138" class="t h">テストの大きさ</text><path d="M78 254L166 160L254 254Z" fill="#4b7b70" stroke="#a9e7c9" stroke-width="2"/><path d="M102 229L166 183L230 229Z" fill="#5a8790"/><path d="M132 207L166 185L200 207Z" fill="#73587a"/><text x="63" y="271" class="s">部品 → 組み合わせ → 画面全体</text>
  <rect x="322" y="106" width="252" height="176" rx="16" fill="#34485e" class="b"/><text x="342" y="138" class="t h">境目の値と状態</text><text x="342" y="171" class="s">0 ─ 1 ─ 100 ─ 101</text><path d="M342 191H537" stroke="#e8b476" stroke-width="4"/><circle cx="342" cy="191" r="8" fill="#dc8e91"/><circle cx="390" cy="191" r="8" fill="#a9e7c9"/><circle cx="501" cy="191" r="8" fill="#a9e7c9"/><circle cx="537" cy="191" r="8" fill="#dc8e91"/><text x="342" y="230" class="s">待機 → 実行 → 完了</text><path d="M342 247H535" stroke="#a9e7c9" stroke-width="3" marker-end="url(#a)"/>
  <rect x="602" y="106" width="256" height="176" rx="16" fill="#4a3a57" class="b"/><text x="622" y="138" class="t h">外部処理は外で置き換え</text><rect x="625" y="165" width="77" height="46" rx="9" fill="#6c5576"/><text x="643" y="193" class="t">テスト</text><path d="M702 188H754" stroke="#a9e7c9" stroke-width="3" marker-end="url(#a)"/><rect x="754" y="165" width="78" height="46" rx="9" fill="#527b74"/><text x="766" y="193" class="t" font-size="13">決済サービス</text><text x="622" y="252" class="s">内部の手順でなく結果を確認</text>
  <rect x="42" y="323" width="390" height="149" rx="16" fill="#304c47" class="b"/><text x="62" y="355" class="t h">予想 → 小さく再現</text><rect x="66" y="389" width="88" height="39" rx="9" fill="#58717c"/><text x="87" y="414" class="t">観察</text><path d="M154 408H213" stroke="#a9e7c9" stroke-width="3" marker-end="url(#a)"/><rect x="213" y="389" width="88" height="39" rx="9" fill="#6d5b76"/><text x="232" y="414" class="t">予想</text><path d="M301 408H360" stroke="#a9e7c9" stroke-width="3" marker-end="url(#a)"/><text x="62" y="457" class="s">条件を一つずつ変えて確かめる</text>
  <rect x="474" y="323" width="384" height="149" rx="16" fill="#473d43" class="b"/><text x="494" y="355" class="t h">動きを変えず整理</text><rect x="500" y="389" width="110" height="39" rx="9" fill="#567875"/><text x="513" y="414" class="t" font-size="13">外から見える約束</text><path d="M610 408H669" stroke="#a9e7c9" stroke-width="3" marker-end="url(#a)"/><rect x="669" y="389" width="143" height="39" rx="9" fill="#62727b"/><text x="692" y="414" class="t">中の作りを整理</text><text x="494" y="457" class="s">動きを確かめながら少しずつ直す</text>
</svg>
