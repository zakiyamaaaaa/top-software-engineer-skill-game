<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">OSとコンピュータ：プログラムが動く仕組み</title>
  <desc id="desc">プログラムの実行単位、仮想メモリ、CPUの高速な記憶、OSへの依頼、待ち時間を示す図。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a8e8ca"/></marker><style>.t{font-family:system-ui,sans-serif;fill:#eff9f4}.s{font-family:system-ui,sans-serif;fill:#bad8cf;font-size:15px}.b{stroke:#65968a;stroke-width:2}.h{font-size:18px;font-weight:700}</style></defs>
  <rect width="900" height="520" rx="24" fill="#172f38"/><text x="42" y="46" class="t" font-size="28" font-weight="700">OSとコンピュータ：プログラムが動く仕組み</text><text x="42" y="75" class="s">プログラム、メモリ、入出力、待ち時間を層ごとに観測する</text>
  <rect x="42" y="105" width="252" height="177" rx="16" fill="#29474f" class="b"/><text x="62" y="137" class="t h">プロセスとスレッド</text><rect x="64" y="157" width="208" height="94" rx="12" fill="#385c68"/><text x="83" y="181" class="s">プロセス：別の実行場所</text><circle cx="100" cy="219" r="12" fill="#e7b476"/><circle cx="151" cy="219" r="12" fill="#e7b476"/><circle cx="202" cy="219" r="12" fill="#e7b476"/><text x="62" y="269" class="s">スレッドは同じ場所を共有</text>
  <rect x="322" y="105" width="252" height="177" rx="16" fill="#344761" class="b"/><text x="342" y="137" class="t h">仮想メモリ</text><text x="342" y="169" class="s">見かけのページ</text><rect x="344" y="182" width="56" height="43" fill="#6e7e9c"/><rect x="406" y="182" width="56" height="43" fill="#6e7e9c"/><rect x="468" y="182" width="56" height="43" fill="#d08e88"/><path d="M534 203H557" stroke="#a8e8ca" stroke-width="3" marker-end="url(#a)"/><text x="342" y="257" class="s">対応表 → 実際の場所</text>
  <rect x="602" y="105" width="256" height="177" rx="16" fill="#4a3a57" class="b"/><text x="622" y="137" class="t h">近いデータを再利用</text><rect x="626" y="164" width="210" height="40" rx="9" fill="#66507a"/><text x="660" y="190" class="t">近いデータを先に読む</text><path d="M656 224H806" stroke="#a8e8ca" stroke-width="3" marker-end="url(#a)"/><text x="622" y="253" class="s">見つかる → 待ち時間が減る</text>
  <rect x="42" y="324" width="390" height="148" rx="16" fill="#334642" class="b"/><text x="62" y="356" class="t h">OSへの依頼と入出力</text><rect x="64" y="386" width="108" height="42" rx="10" fill="#527970"/><text x="94" y="412" class="t">アプリ</text><path d="M172 407H248" stroke="#a8e8ca" stroke-width="3" marker-end="url(#a)"/><rect x="248" y="386" width="112" height="42" rx="10" fill="#496b70"/><text x="272" y="412" class="t">OSの中核</text><path d="M360 407H407" stroke="#a8e8ca" stroke-width="3" marker-end="url(#a)"/><text x="64" y="456" class="s">OSを通して機器へ依頼</text>
  <rect x="474" y="324" width="384" height="148" rx="16" fill="#473b42" class="b"/><text x="494" y="356" class="t h">待つ理由</text><text x="494" y="388" class="s">CPU待ち：順番を待つ</text><path d="M710 383H816" stroke="#e8b476" stroke-width="5"/><text x="494" y="418" class="s">入出力待ち：機器の返事</text><path d="M710 413H816" stroke="#d08e88" stroke-width="5"/><text x="494" y="451" class="s">忙しさと待ち時間を分けて測る</text>
</svg>
