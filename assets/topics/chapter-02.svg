<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">データ構造とアルゴリズム：構造と探索</title>
  <desc id="desc">入力が増えたときの手順数、データの並べ方、索引、関係の表し方、半分ずつ探す方法を示す図。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a9e6c7"/></marker><style>.t{font-family:system-ui,sans-serif;fill:#f0faf4}.s{font-family:system-ui,sans-serif;fill:#bbd9cf;font-size:15px}.b{stroke:#67988a;stroke-width:2}.h{font-size:18px;font-weight:700}</style></defs>
  <rect width="900" height="520" rx="24" fill="#172f38"/><text x="42" y="46" class="t" font-size="28" font-weight="700">データ構造とアルゴリズム：構造と探索</text><text x="42" y="75" class="s">データの並べ方と探し方で、必要な手順の数が変わる</text>
  <rect x="42" y="106" width="250" height="172" rx="16" fill="#294650" class="b"/><text x="62" y="139" class="t h">手順数の増え方</text><path d="M74 247V166M74 247H258" stroke="#a9e6c7" stroke-width="2"/><path d="M79 236L150 218L247 171" fill="none" stroke="#82c3ff" stroke-width="3"/><path d="M79 236L150 226L247 211" fill="none" stroke="#e8b375" stroke-width="3"/><path d="M79 236L112 228L247 231" fill="none" stroke="#e98e9b" stroke-width="3"/><text x="150" y="174" class="s" font-size="12">二重ループ O(n²)</text><text x="150" y="203" class="s" font-size="12">入力に比例 O(n)</text><text x="136" y="262" class="s" font-size="12">半分ずつ O(log n)</text>
  <rect x="322" y="106" width="250" height="172" rx="16" fill="#344761" class="b"/><text x="342" y="139" class="t h">データの並べ方</text><text x="342" y="170" class="s">配列：番号で読む</text><text x="342" y="197" class="s">スタック：後から出す</text><text x="342" y="224" class="s">キュー：先に入れた物から出す</text><text x="342" y="251" class="s">リスト：要素を順につなぐ</text>
  <rect x="602" y="106" width="256" height="172" rx="16" fill="#4a3b58" class="b"/><text x="622" y="139" class="t h">キーで素早く探す</text><text x="622" y="170" class="s">キー → 計算した番号 → 入れ物</text><rect x="630" y="190" width="198" height="46" rx="10" fill="#695171"/><text x="673" y="219" class="t">同じ番号 → つなぐ / 移す</text><text x="622" y="260" class="s">混むと入れ物を増やす</text>
  <rect x="42" y="322" width="390" height="150" rx="16" fill="#273f47" class="b"/><text x="62" y="354" class="t h">木とつながり</text><circle cx="237" cy="381" r="15" fill="#e8b375"/><circle cx="168" cy="429" r="15" fill="#78c9b4"/><circle cx="306" cy="429" r="15" fill="#78c9b4"/><path d="M227 393L178 417M247 393L296 417M306 429L355 429" stroke="#a9e6c7" stroke-width="3" marker-end="url(#a)"/><circle cx="355" cy="429" r="15" fill="#82c3ff"/><text x="62" y="458" class="s">階層か、複雑なつながりか</text>
  <rect x="474" y="322" width="384" height="150" rx="16" fill="#403a42" class="b"/><text x="494" y="354" class="t h">並べて半分ずつ探す</text><rect x="500" y="387" width="50" height="38" fill="#5d6873"/><rect x="550" y="387" width="50" height="38" fill="#5d6873"/><rect x="600" y="387" width="50" height="38" fill="#e8b375"/><rect x="650" y="387" width="50" height="38" fill="#5d6873"/><rect x="700" y="387" width="50" height="38" fill="#5d6873"/><text x="515" y="412" class="t">1</text><text x="565" y="412" class="t">3</text><text x="615" y="412" class="t">5</text><text x="665" y="412" class="t">7</text><text x="715" y="412" class="t">9</text><path d="M625 435V458" stroke="#a9e6c7" stroke-width="3" marker-end="url(#a)"/><text x="494" y="466" class="s">中央を比べて範囲を半分にする</text>
</svg>
