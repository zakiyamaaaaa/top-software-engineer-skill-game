<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">メモリ管理：参照がデータの寿命を決める</title>
  <desc id="desc">呼び出しの記録と動的なデータ置き場、データの寿命、不要なデータの回収、資源を安全に解放する方法を示す図。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a8e6c6"/></marker><style>.t{font-family:system-ui,sans-serif;fill:#eff9f4}.s{font-family:system-ui,sans-serif;fill:#b9d7ce;font-size:15px}.b{stroke:#65978b;stroke-width:2}.h{font-size:18px;font-weight:700}</style></defs>
  <rect width="900" height="520" rx="24" fill="#172f38"/><text x="42" y="46" class="t" font-size="28" font-weight="700">メモリ管理：参照がデータの寿命を決める</text><text x="42" y="75" class="s">どのデータが使われているか、誰が持つか、いつ解放するかを追う</text>
  <rect x="42" y="105" width="240" height="176" rx="16" fill="#294650" class="b"/><text x="62" y="138" class="t h">スタック</text><rect x="73" y="157" width="178" height="38" rx="8" fill="#466570"/><text x="95" y="182" class="t">関数の作業場所</text><rect x="73" y="204" width="178" height="38" rx="8" fill="#385863"/><text x="96" y="229" class="t">戻る場所・一時的な値</text><text x="62" y="265" class="s" font-size="13">呼び出しで積み、終了で外す</text>
  <rect x="326" y="105" width="242" height="176" rx="16" fill="#34465b" class="b"/><text x="346" y="138" class="t h">ヒープ</text><circle cx="393" cy="196" r="30" fill="#6c7390"/><circle cx="492" cy="196" r="30" fill="#5b7d91"/><path d="M423 196H462" stroke="#a8e6c6" stroke-width="3" marker-end="url(#a)"/><text x="354" y="247" class="s">データと参照先</text><path d="M251 175H360" stroke="#a8e6c6" stroke-width="3" marker-end="url(#a)"/>
  <rect x="612" y="105" width="246" height="176" rx="16" fill="#4a3a57" class="b"/><text x="632" y="138" class="t h">不要なデータを片づける</text><text x="632" y="171" class="s">使う道がある → 残す</text><text x="632" y="199" class="s">使う道がない → 自動回収</text><text x="632" y="227" class="s">持ち主が終了 → 解放</text><text x="632" y="263" class="s">数える方式は循環に注意</text>
  <rect x="42" y="323" width="392" height="149" rx="16" fill="#3b3b47" class="b"/><text x="62" y="355" class="t h">不要なデータが残る道</text><circle cx="105" cy="416" r="17" fill="#e98e9b"/><circle cx="230" cy="416" r="17" fill="#e98e9b"/><circle cx="355" cy="416" r="17" fill="#e98e9b"/><path d="M122 416H213M247 416H338" stroke="#ffb18b" stroke-width="3" marker-end="url(#a)"/><text x="73" y="450" class="s">一時保存 → 通知登録 → 不要データ</text>
  <rect x="476" y="323" width="382" height="149" rx="16" fill="#2a484b" class="b"/><text x="496" y="355" class="t h">資源を安全に使う</text><rect x="501" y="389" width="88" height="40" rx="10" fill="#4d806e"/><text x="523" y="414" class="t">確保</text><path d="M589 409H620" stroke="#a8e6c6" stroke-width="3" marker-end="url(#a)"/><rect x="620" y="389" width="88" height="40" rx="10" fill="#527b6a"/><text x="642" y="414" class="t">使う</text><path d="M708 409H739" stroke="#a8e6c6" stroke-width="3" marker-end="url(#a)"/><rect x="739" y="389" width="88" height="40" rx="10" fill="#527b6a"/><text x="761" y="414" class="t">片づける</text><text x="496" y="466" class="s">処理終了や失敗でも片づける</text>
</svg>
