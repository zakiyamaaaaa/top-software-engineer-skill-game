<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">並行・非同期処理：順序と共有を設計する</title>
  <desc id="desc">同時に進む処理、共有データの競合、同期、行き詰まり、中止と時間制限を示す図。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#aae8ca"/></marker><style>.t{font-family:system-ui,sans-serif;fill:#eff9f4}.s{font-family:system-ui,sans-serif;fill:#bad9cf;font-size:15px}.b{stroke:#65988a;stroke-width:2}.h{font-size:18px;font-weight:700}</style></defs>
  <rect width="900" height="520" rx="24" fill="#172f38"/><text x="42" y="46" class="t" font-size="28" font-weight="700">並行・非同期処理：順序と共有を設計する</text><text x="42" y="75" class="s">同時に進む仕事ほど、共有データ・停止・期限の決め方が重要になる</text>
  <rect x="42" y="106" width="252" height="175" rx="16" fill="#29474e" class="b"/><text x="62" y="138" class="t h">並行・並列・非同期</text><text x="62" y="170" class="s">仕事A ───┐</text><text x="62" y="198" class="s">仕事B ───┘ → 完了通知</text><rect x="67" y="218" width="196" height="40" rx="10" fill="#416a70"/><text x="91" y="244" class="t">待つ間は別の仕事へ</text>
  <rect x="322" y="106" width="252" height="175" rx="16" fill="#344861" class="b"/><text x="342" y="138" class="t h">共有データを守る</text><rect x="349" y="164" width="78" height="42" rx="8" fill="#cf8b88"/><text x="367" y="191" class="t">共有データ</text><path d="M349 227H427" stroke="#aae8ca" stroke-width="4" marker-end="url(#a)"/><path d="M500 227H427" stroke="#aae8ca" stroke-width="4" marker-end="url(#a)"/><circle cx="500" cy="227" r="20" fill="#60799a"/><text x="342" y="260" class="s">一度に更新 / 鍵をかける</text>
  <rect x="602" y="106" width="256" height="175" rx="16" fill="#4a3a57" class="b"/><text x="622" y="138" class="t h">お互いに待って停止</text><circle cx="680" cy="198" r="28" fill="#c77b84"/><circle cx="780" cy="198" r="28" fill="#c77b84"/><path d="M708 188H750" stroke="#ffb08b" stroke-width="3" marker-end="url(#a)"/><path d="M752 208H710" stroke="#ffb08b" stroke-width="3" marker-end="url(#a)"/><text x="622" y="252" class="s">持ったまま待ち続ける</text>
  <rect x="42" y="323" width="390" height="149" rx="16" fill="#314946" class="b"/><text x="62" y="355" class="t h">同期に使う道具</text><rect x="67" y="387" width="92" height="38" rx="9" fill="#507c6e"/><text x="87" y="412" class="t">1人ずつ使う</text><rect x="175" y="387" width="92" height="38" rx="9" fill="#57776e"/><text x="189" y="412" class="t">人数を制限</text><rect x="283" y="387" width="116" height="38" rx="9" fill="#4d6b6d"/><text x="297" y="412" class="t">状態を待つ</text><text x="62" y="457" class="s">用途に応じて道具を選ぶ</text>
  <rect x="474" y="323" width="384" height="149" rx="16" fill="#473b42" class="b"/><text x="494" y="355" class="t h">中止と時間制限</text><path d="M507 408H764" stroke="#aae8ca" stroke-width="5"/><circle cx="560" cy="408" r="12" fill="#e8b476"/><circle cx="680" cy="408" r="12" fill="#e8b476"/><path d="M764 390V426" stroke="#d78b8e" stroke-width="4"/><text x="494" y="451" class="s">中止を伝える → 後始末 → 終了</text>
</svg>
