<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" role="img" aria-labelledby="title desc">
<title id="title">オブジェクト指向の4つの考え方</title><desc id="desc">カプセル化はデータを守る、抽象化は必要な操作を見せる、継承は一種である関係、多態性は同じ操作で実装を選ぶ。部品を持つコンポジションとの違いも示す。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b8e6cc"/></marker><style>text{font-family:system-ui,sans-serif;fill:#eff9f4;font-size:17px}.heading{font-size:22px;font-weight:700}.note{fill:#c0d8cf;font-size:16px}.box{stroke:#77988b;stroke-width:2}.arrow{stroke:#b8e6cc;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="900" height="710" rx="24" fill="#172f38"/>
<text x="38" y="48" style="font-size:29px" font-weight="700">オブジェクト指向：4つの考え方を区別する</text>
<text x="38" y="80" class="note">データと操作をまとめ、使う側と作る側の役割を考える</text>
<rect x="36" y="110" width="404" height="225" rx="15" fill="#294650" class="box"/>
<text x="56" y="148" class="heading">① カプセル化：データを守る</text>
<rect x="58" y="174" width="160" height="52" rx="9" fill="#526e75"/><text x="78" y="206">出金額を確認</text>
<path d="M220 200H258" class="arrow"/><rect x="260" y="174" width="155" height="52" rx="9" fill="#4f7767"/><text x="280" y="206">非公開の残高</text>
<text x="56" y="266" class="note">外から直接書き換えさせない</text><text x="56" y="298" class="note">操作の中で「残高は負にしない」を守る</text>
<rect x="460" y="110" width="404" height="225" rx="15" fill="#34465b" class="box"/>
<text x="480" y="148" class="heading">② 抽象化：必要な操作を見せる</text>
<rect x="483" y="174" width="166" height="52" rx="9" fill="#516d81"/><text x="502" y="206">使う側：send</text><path d="M650 200H690" class="arrow"/><rect x="692" y="174" width="146" height="52" rx="9" fill="#695878"/><text x="710" y="206">内部の送信処理</text>
<text x="480" y="266" class="note">使う側は「送信する」だけを知る</text><text x="480" y="298" class="note">接続や通信の詳しい手順は隠す</text>
<rect x="36" y="355" width="404" height="225" rx="15" fill="#493d53" class="box"/>
<text x="56" y="393" class="heading">③ 継承：親の仕組みを受け継ぐ</text>
<rect x="60" y="418" width="162" height="52" rx="9" fill="#665477"/><text x="80" y="451">文書：題名変更</text><path d="M224 444H258" class="arrow"/><rect x="260" y="418" width="155" height="52" rx="9" fill="#746381"/><text x="284" y="451">報告書：要約</text>
<text x="56" y="509" class="note">報告書は文書の「一種」</text><text x="56" y="543" class="note">報告書でも題名を変更できる</text>
<rect x="460" y="355" width="404" height="225" rx="15" fill="#2d4844" class="box"/>
<text x="480" y="393" class="heading">④ 多態性：同じ操作、違う実装</text>
<rect x="484" y="428" width="140" height="52" rx="9" fill="#4d7a70"/><text x="503" y="461">send(本文)</text><path d="M626 454L690 428M626 454L690 483" class="arrow"/><text x="705" y="434">メール送信</text><text x="705" y="489">SMS送信</text>
<text x="480" y="543" class="note">渡す部品によって送信方法が変わる</text>
<rect x="36" y="602" width="828" height="78" rx="12" fill="#23413d" class="box"/>
<text x="56" y="633" font-weight="700">コンポジション（部品の組み合わせ）との違い</text>
<text x="56" y="661" class="note">継承：報告書は文書の一種　／　組み合わせ：注文処理は保存・通知の部品を持つ</text>
</svg>
