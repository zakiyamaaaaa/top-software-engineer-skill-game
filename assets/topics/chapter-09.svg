<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">セキュリティ：本人確認・権限・秘密を守る</title>
  <desc id="desc">本人確認と操作の許可、入力攻撃への対策、暗号、秘密情報、必要最小限の権限を示す図。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a8e7c9"/></marker><style>.t{font-family:system-ui,sans-serif;fill:#eff9f4}.s{font-family:system-ui,sans-serif;fill:#bad8cf;font-size:15px}.b{stroke:#65978a;stroke-width:2}.h{font-size:18px;font-weight:700}</style></defs>
  <rect width="900" height="520" rx="24" fill="#172f38"/><text x="42" y="46" class="t" font-size="28" font-weight="700">セキュリティ：本人確認・権限・秘密を守る</text><text x="42" y="75" class="s">入力と認証情報を境目で確かめ、必要な操作だけを許可する</text>
  <rect x="42" y="106" width="252" height="176" rx="16" fill="#29474f" class="b"/><text x="62" y="138" class="t h">本人確認 → 操作を許可</text><circle cx="105" cy="194" r="25" fill="#e8b476"/><text x="91" y="200" class="t">本人</text><path d="M130 194H190" stroke="#a8e7c9" stroke-width="3" marker-end="url(#a)"/><rect x="190" y="171" width="78" height="47" rx="10" fill="#527b73"/><text x="205" y="201" class="t">許可</text><text x="62" y="250" class="s">誰が何をするか毎回確認</text>
  <rect x="322" y="106" width="252" height="176" rx="16" fill="#4a3a57" class="b"/><text x="342" y="138" class="t h">危険な入力を防ぐ</text><text x="342" y="170" class="s" font-size="13">SQL（検索文）・HTML（画面）</text><path d="M342 193H522" stroke="#dc8e91" stroke-width="5"/><text x="342" y="225" class="s">入力を分けて安全に表示</text><text x="342" y="257" class="s">別サイト操作を防ぐ印・制限</text>
  <rect x="602" y="106" width="256" height="176" rx="16" fill="#34485e" class="b"/><text x="622" y="138" class="t h">暗号で守れること</text><text x="622" y="171" class="s">暗号化：中身を隠す</text><text x="622" y="198" class="s">ハッシュ：短い識別値</text><text x="622" y="225" class="s">署名：送信者を確認</text><text x="622" y="258" class="s">目的に合う方法を選ぶ</text>
  <rect x="42" y="323" width="390" height="149" rx="16" fill="#304b47" class="b"/><text x="62" y="355" class="t h">秘密情報を安全に保管</text><rect x="67" y="388" width="105" height="40" rx="9" fill="#5b6b82"/><text x="76" y="414" class="t" font-size="13">安全な保管場所</text><path d="M172 408H244" stroke="#a8e7c9" stroke-width="3" marker-end="url(#a)"/><rect x="244" y="388" width="105" height="40" rx="9" fill="#527a72"/><text x="267" y="414" class="t">期限付きの鍵</text><text x="62" y="457" class="s">プログラムや記録から分ける</text>
  <rect x="474" y="323" width="384" height="149" rx="16" fill="#473d43" class="b"/><text x="494" y="355" class="t h">境目を守り必要な権限だけ</text><rect x="500" y="388" width="109" height="40" rx="9" fill="#6d596e"/><text x="522" y="414" class="t">外からの入力</text><path d="M609 408H670" stroke="#ffb08b" stroke-width="4" marker-end="url(#a)"/><rect x="670" y="388" width="145" height="40" rx="9" fill="#52766d"/><text x="695" y="414" class="t">必要なものだけ</text><text x="494" y="457" class="s">受け取るたびにもう一度確認</text>
</svg>
