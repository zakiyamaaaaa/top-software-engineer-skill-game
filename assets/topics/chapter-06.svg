<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">ネットワークとWeb：通信の層と約束</title>
  <desc id="desc">名前を調べる仕組み、暗号化通信、Web通信、届け方の違い、再利用、サービス間の約束を示す図。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a9e7ca"/></marker><style>.t{font-family:system-ui,sans-serif;fill:#eff9f4}.s{font-family:system-ui,sans-serif;fill:#bad8cf;font-size:15px}.b{stroke:#65978b;stroke-width:2}.h{font-size:18px;font-weight:700}</style></defs>
  <rect width="900" height="520" rx="24" fill="#172f38"/><text x="42" y="46" class="t" font-size="28" font-weight="700">ネットワークとWeb：通信の層と約束</text><text x="42" y="75" class="s">名前、接続、安全、メッセージの意味を分けて扱う</text>
  <rect x="42" y="106" width="395" height="174" rx="16" fill="#29464f" class="b"/><text x="62" y="138" class="t h">つながるまで</text><rect x="65" y="165" width="88" height="42" rx="9" fill="#527b72"/><text x="73" y="191" class="t" font-size="13">DNS（名前）</text><path d="M153 186H189" stroke="#a9e7ca" stroke-width="3" marker-end="url(#a)"/><rect x="189" y="165" width="100" height="42" rx="9" fill="#4d687b"/><text x="200" y="191" class="t" font-size="13">TLS（暗号）</text><path d="M289 186H325" stroke="#a9e7ca" stroke-width="3" marker-end="url(#a)"/><rect x="325" y="165" width="88" height="42" rx="9" fill="#665078"/><text x="340" y="191" class="t" font-size="13">HTTP通信</text><text x="62" y="247" class="s">名前を調べる → 暗号化 → 要求と応答</text>
  <rect x="467" y="106" width="391" height="174" rx="16" fill="#34475f" class="b"/><text x="487" y="138" class="t h">TCP と UDP</text><text x="487" y="171" class="s">TCP：順序を守り、失敗時は再送</text><path d="M487 196H820" stroke="#7fc4ff" stroke-width="5" marker-end="url(#a)"/><text x="487" y="229" class="s">UDP：順序と再送を保証しない</text><path d="M487 251L560 238L635 252L710 238L820 251" fill="none" stroke="#e8b475" stroke-width="3"/>
  <rect x="42" y="323" width="390" height="149" rx="16" fill="#493b52" class="b"/><text x="62" y="355" class="t h">Web通信の指示と再利用</text><text x="62" y="387" class="s">読む / 書く → 結果 → データ</text><rect x="66" y="405" width="124" height="37" rx="9" fill="#665477"/><text x="90" y="429" class="t">更新番号</text><path d="M190 423H254" stroke="#a9e7ca" stroke-width="3" marker-end="url(#a)"/><rect x="254" y="405" width="145" height="37" rx="9" fill="#54747b"/><text x="274" y="429" class="t">変更なし→再利用</text>
  <rect x="474" y="323" width="384" height="149" rx="16" fill="#304946" class="b"/><text x="494" y="355" class="t h">サービス間の約束</text><rect x="500" y="386" width="110" height="42" rx="9" fill="#4d7a70"/><text x="527" y="412" class="t">入力</text><path d="M610 407H671" stroke="#a9e7ca" stroke-width="3" marker-end="url(#a)"/><rect x="671" y="386" width="142" height="42" rx="9" fill="#557673"/><text x="689" y="412" class="t">結果</text><text x="494" y="456" class="s">形式と変更ルールを共有する</text>
</svg>
